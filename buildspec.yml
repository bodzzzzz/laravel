version: 0.2

phases:
  install:
    commands:
      - echo "Installing Composer dependencies..."
      - curl -sS https://getcomposer.org/installer | php
      - php composer.phar install --no-dev --optimize-autoloader
      - find . -type d -exec chmod 755 {} \;
      - find . -type f -exec chmod 644 {} \;
      - chmod -R 775 storage bootstrap/cache

  pre_build:
    commands:
    - echo "Setting up Laravel environment..."
    - test -f .env || cp .env.example .env
    # Create required directories with correct permissions
    - mkdir -p bootstrap/cache storage/framework/{cache,sessions,views}
    - chmod -R 775 storage bootstrap/cache
    # Only generate key if missing
    - if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
    # Clear caches with error handling
    - php artisan config:clear || true
    - php artisan view:clear || true
    - php artisan route:clear || true
    - rm -f bootstrap/cache/routes-v7.php
    - (php artisan cache:clear || true)
    # Optimize
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache

  build:
    commands:
      - echo "Build complete. Laravel app is ready."

artifacts:
  files:
    - '**/*'
  discard-paths: no
