version: 0.2

phases:
  install:
    commands:
      - echo "Installing Composer dependencies..."
      - curl -sS https://getcomposer.org/installer | php
      - php composer.phar install --no-dev --optimize-autoloader
      - composer dump-autoload --optimize

  pre_build:
    commands:
      - echo "Configuring Laravel environment..."
      - test -f .env || cp .env.example .env
      - mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
      - find . -type d -exec chmod 755 {} \;
      - find . -type f -exec chmod 644 {} \;
      - chmod -R 775 storage bootstrap/cache
      - touch storage/logs/laravel.log
      - chmod 664 storage/logs/laravel.log

      # Only generate key if not set or empty
      - if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi

      echo "Clearing and rebuilding caches..."
      - php artisan cache:clear || true
      - php artisan config:clear
      - php artisan route:clear
      - php artisan view:clear
      - php artisan event:clear

  build:
    commands:
      - echo "Optimizing application..."
      - php artisan config:cache
      - php artisan route:cache
      - php artisan view:cache
      - php artisan optimize

      echo "Verifying installation..."
      - php artisan --version
      - php -m | grep -i openssl

artifacts:
  files:
    - '**/*'
  discard-paths: no
  base-directory: $CODEBUILD_SRC_DIR

cache:
  paths:
    - 'vendor/**/*'
    - 'bootstrap/cache/**/*'
